[package]
name = "mock-ft"
description = "Open-mint NEP-141 test token for Saving Circles tests and the testnet demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BreadchainCoop/saving-circles-near"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
