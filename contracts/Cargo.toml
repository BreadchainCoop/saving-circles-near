[package]
name = "saving-circles"
description = "Rotating savings circles (ROSCAs) for NEP-141 tokens on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BreadchainCoop/saving-circles-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[workspace]
members = ["mock-ft"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
