[package]
name = "saving-circles"
description = "Rotating savings circles (ROSCAs) for NEP-141 tokens on NEAR"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BreadchainCoop/saving-circles-near"

# `cargo near build reproducible-wasm` builds in this image so NearBlocks can rebuild the
# same wasm and verify the deployed contract. Keep cargo-near in sync with CI.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[workspace]
members = ["mock-ft"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
